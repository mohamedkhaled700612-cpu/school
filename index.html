<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدرسة البتانون الثانوية المطورة</title>
<style>*{box-sizing:border-box;font-family:'Segoe UI',Tahoma;margin:0}body{background:#0a1f44;min-height:100vh;display:flex;flex-direction:column}.login-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}.login-box{background:#fff;padding:30px;border-radius:18px;max-width:400px;width:100%;text-align:center}.login-box img{width:110px;height:110px;border-radius:50%;object-fit:cover;border:4px solid #d4a017}.btn{padding:13px;border-radius:10px;border:none;font-weight:bold;cursor:pointer;background:#d4a017;color:#0a1f44;width:100%;margin-top:10px}.btn-del{background:#ef4444;color:#fff;padding:8px 14px;border:none;border-radius:8px;cursor:pointer;margin-top:8px}input,textarea{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px}#dash{display:none;flex-direction:column;min-height:100vh;background:#eef2f7}.header{background:#0a1f44;color:#fff;padding:10px 15px;display:flex;justify-content:space-between;align-items:center}.badge{background:#d4a017;color:#0a1f44;padding:4px 12px;border-radius:15px;font-size:12px;font-weight:bold}.main{flex:1;max-width:1100px;width:100%;margin:0 auto;padding:15px}.card{background:#fff;padding:20px;border-radius:14px;margin-bottom:14px}.tabs{display:flex;gap:8px;overflow-x:auto;background:#fff;padding:12px;position:sticky;top:0;z-index:10}.tabs span{padding:10px 18px;background:#f0f2f5;border-radius:25px;cursor:pointer;white-space:nowrap}.tabs span.on{background:#0a1f44;color:#fff}.footer{background:#071430;color:#fff;text-align:center;padding:20px}.footer b{color:#d4a017}.empty{background:#f8fafc;border:2px dashed #e2e8f0;padding:30px;text-align:center;border-radius:12px;color:#64748b}.upload-box{background:#f8fafc;padding:15px;border-radius:10px;margin:12px 0;border:2px dashed #cbd5e1}</style>
</head>
<body>
<div id="loginPage" class="login-wrap">
<div class="login-box">
<img src="https://i.ibb.co/SD12XjKb/file-00000000a8b8824398c2d1d125682b5c.png">
<h1>مدرسة البتانون الثانوية المطورة</h1>
<p style="color:#666;margin:8px 0">المنوفية - إدارة شبين الكوم التعليمية</p>
<input id="u" dir="ltr" placeholder="الإيميل" autocomplete="off">
<input id="p" type="password" placeholder="كلمة السر">
<button class="btn" onclick="login()">دخول</button>
</div>
<div style="color:#fff;opacity:.7;margin-top:15px">Made by <b style="color:#d4a017">Mohamed Khaled</b> © 2026</div>
</div>
<div id="dash">
<div class="header"><div style="display:flex;align-items:center;gap:10px"><b id="w"></b><span class="badge" id="rb"></span></div><button onclick="logout()" style="padding:8px 16px;border-radius:8px;border:none;cursor:pointer">خروج</button></div>
<div class="tabs" id="tabs"></div><div class="main" id="c"></div>
<div class="footer">مدرسة البتانون الثانوية المطورة © 2026<br>Made by <b>Mohamed Khaled</b></div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, query, orderBy, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
const firebaseConfig={apiKey:"AIzaSyDfMX56_f6EcNn97247Q4m2fcMbWaU-kCQ",authDomain:"school-d50aa.firebaseapp.com",projectId:"school-d50aa",storageBucket:"school-d50aa.firebasestorage.app",messagingSenderId:"14520467716",appId:"1:14520467716:web:a9874d7152ab6e4b255051"};
const app=initializeApp(firebaseConfig); const db=getFirestore(app); const auth=getAuth(app);
const CLOUD_NAME="fkmbapdm"; const UPLOAD_PRESET="abs8ekdc";
function esc(s){ if(!s) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function safeUrl(u){ if(!u) return ""; u=String(u).trim(); if(u.startsWith("https://res.cloudinary.com/")||u.startsWith("data:image/")||u.startsWith("https://")) return u; return ""; }
function getRole(email){ if(email==="admin@school.com") return {r:"إدارة",n:"مدير المدرسة"}; if(email==="teacher@school.com") return {r:"معلم",n:"أستاذ محمد"}; return {r:"طالب",n:"طالب"}; }
let curRole="طالب", curName="";
window.login=async function(){ let e=document.getElementById('u').value.trim(), pw=document.getElementById('p').value; if(!e||!pw) return alert("اكتب الإيميل والباسورد"); try{ await signInWithEmailAndPassword(auth,e,pw); let inf=getRole(e); curRole=inf.r; curName=inf.n; document.getElementById('loginPage').style.display='none'; document.getElementById('dash').style.display='flex'; document.getElementById('w').innerText="أهلاً "+curName; document.getElementById('rb').innerText=curRole; let t=curRole==="إدارة"?["الأخبار","الجداول","الملفات","النتائج","الأوائل","تواصل"]:curRole==="معلم"?["الأخبار","الجداول","الملفات","الأوائل","تواصل"]:["الأخبار","الجداول","الملفات","النتيجة","الأوائل","تواصل"]; let tb=document.getElementById('tabs'); tb.innerHTML=t.map((x,i)=>`<span class="${i==0?'on':''}">${esc(x)}</span>`).join(""); [...tb.children].forEach((sp,ix)=>sp.onclick=()=>go(t[ix],sp)); go(t[0],tb.children[0]); }catch(er){ alert("فشل الدخول: "+er.message); } };
window.logout=async function(){ await signOut(auth); location.reload(); };
function canEdit(){return curRole==="إدارة"||curRole==="معلم";} function canDelete(){return curRole==="إدارة";}
function refresh(n){let a=[...document.querySelectorAll('#tabs span')];let i=a.findIndex(s=>s.textContent==n);if(i>=0)go(n,a[i]);}
async function uploadToCloudinary(file){ if(!file.type.startsWith('image/')) throw new Error("لازم ترفع صورة فقط"); const fd=new FormData(); fd.append("file",file); fd.append("upload_preset",UPLOAD_PRESET); const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,{method:"POST",body:fd}); const data=await res.json(); if(!data.secure_url) throw new Error("فشل الرفع على Cloudinary: "+(data.error?.message||"")); return data.secure_url; }
window.go=async function(n,el){ try{ if(el){[...document.querySelectorAll('#tabs span')].forEach(s=>s.classList.remove('on'));el.classList.add('on');} let c=document.getElementById('c');
if(n=="الأخبار"){ c.innerHTML=(canEdit()?`<div class="card"><h3>📰 نشر خبر</h3><input id="nt" placeholder="عنوان الخبر"><textarea id="nd" placeholder="التفاصيل"></textarea><button class="btn" onclick="publishNews()">نشر</button></div>`:"")+`<div id="nl">جاري التحميل...</div>`; let s=await getDocs(query(collection(db,"news"),orderBy("createdAt","desc"))); document.getElementById('nl').innerHTML=s.empty?`<div class="empty">لا توجد أخبار</div>`:s.docs.map(d=>{let x=d.data();return `<div class="card"><b>${esc(x.title)}</b><p>${esc(x.details)}</p><small>بواسطة: ${esc(x.by)}</small>${canDelete()?`<br><button class="btn-del" onclick="delAny('news','${d.id}','الأخبار')">مسح</button>`:""}</div>`}).join(""); return; }
if(n=="الجداول"){ c.innerHTML=`<div class="card"><h3>📅 الجداول</h3>${canEdit()?`<div class="upload-box"><input id="tT" placeholder="عنوان الجدول"><input type="file" id="tF" accept="image/*"><button class="btn" onclick="upTable()">رفع على Cloudinary</button></div>`:""}<div id="tL"></div></div>`; let s=await getDocs(collection(db,"tables")); document.getElementById('tL').innerHTML=s.empty?`<div class="empty">فاضي</div>`:s.docs.map(d=>{let x=d.data();let u=safeUrl(x.url);return `<div class="card" style="background:#f8fafc"><b>${esc(x.title)}</b><br>${u?`<img src="${u}" style="max-width:100%;border-radius:8px" loading="lazy">`:""}${canDelete()?`<br><button class="btn-del" onclick="delAny('tables','${d.id}','الجداول')">مسح</button>`:""}</div>`}).join(""); return; }
if(n=="الملفات"){ c.innerHTML=`<div class="card"><h3>📁 الملفات</h3>${canEdit()?`<div class="upload-box"><input id="bT" placeholder="اسم الكتاب"><input id="bL" dir="ltr" placeholder="رابط Drive"><button class="btn" style="background:#0a1f44;color:#fff" onclick="addBookLink()">حفظ الرابط</button></div>`:""}<div id="fL"></div></div>`; let s=await getDocs(collection(db,"files")); document.getElementById('fL').innerHTML=s.empty?`<div class="empty">فاضي</div>`:s.docs.map(d=>{let x=d.data();return `<div class="card" style="background:#f8fafc"><b>${esc(x.title)}</b><br><a href="${esc(x.url)}" target="_blank" style="background:#0a1f44;color:#fff;padding:10px 18px;border-radius:8px;display:inline-block;margin-top:8px;text-decoration:none">📖 فتح</a>${canDelete()?`<br><button class="btn-del" onclick="delAny('files','${d.id}','الملفات')">مسح</button>`:""}</div>`}).join(""); return; }
if(n=="النتائج"){ c.innerHTML=`<div class="card"><h3>🎓 إدارة النتائج</h3><input id="rn" placeholder="رقم الجلوس"><input id="rname" placeholder="الاسم"><input id="rt" placeholder="المجموع"><button class="btn" onclick="pubRes()">حفظ</button><div id="rl"></div></div>`; let s=await getDocs(collection(db,"results")); document.getElementById('rl').innerHTML=s.docs.map(d=>{let r={id:d.id,...d.data()};return `<div style="display:flex;justify-content:space-between;background:#f8fafc;padding:10px;border-radius:8px;margin:6px 0"><span>${esc(r.name)}-${esc(r.seat)}</span><button class="btn-del" style="margin:0" onclick="delAny('results','${r.id}','النتائج')">مسح</button></div>`}).join(""); return; }
if(n=="النتيجة"){ c.innerHTML=`<div class="card" style="text-align:center"><h3>🎓 نتيجتك</h3><input id="seat" placeholder="رقم الجلوس" style="max-width:300px;margin:10px auto"><button class="btn" style="max-width:300px" onclick="getRes()">عرض</button><div id="rr"></div></div>`; return; }
if(n=="الأوائل"){ c.innerHTML=`<div class="card"><h3>🏆 الأوائل</h3>${canEdit()?`<div class="upload-box"><input id="oN" placeholder="الاسم"><input id="oT" placeholder="المجموع"><input type="file" id="oF" accept="image/*"><button class="btn" onclick="upTop()">رفع على Cloudinary</button></div>`:""}<div id="oL"></div></div>`; let s=await getDocs(collection(db,"tops")); document.getElementById('oL').innerHTML=s.empty?`<div class="empty">فاضي</div>`:s.docs.map(d=>{let x=d.data();let u=safeUrl(x.url);return `<div class="card" style="display:inline-block;width:calc(50% - 12px);margin:6px;text-align:center">${u?`<img src="${u}" style="width:90px;height:90px;border-radius:50%;object-fit:cover" loading="lazy">`:""}<br><b>${esc(x.name)}</b><br>${esc(x.total)}${canDelete()?`<br><button class="btn-del" onclick="delAny('tops','${d.id}','الأوائل')">مسح</button>`:""}</div>`}).join(""); return; }
if(n=="تواصل"){ c.innerHTML=`<div class="card" style="text-align:center"><h3>مدرسة البتانون الثانوية المطورة</h3><p>البتانون - شبين الكوم - المنوفية</p></div>`; return; }
}catch(e){ alert("خطأ: "+e.message); } };
window.publishNews=async function(){try{let t=document.getElementById('nt').value.trim();if(!t)return alert("اكتب العنوان");await addDoc(collection(db,"news"),{title:t,details:document.getElementById('nd').value,by:curName,createdAt:Date.now()});alert("تم ✅");refresh('الأخبار');}catch(e){alert(e.message)}};
window.delAny=async function(a,b,c2){if(!confirm("مسح؟"))return;try{await deleteDoc(doc(db,a,b));refresh(c2);}catch(e){alert(e.message)}};
window.pubRes=async function(){try{await addDoc(collection(db,"results"),{seat:document.getElementById('rn').value.trim(),name:document.getElementById('rname').value.trim(),total:document.getElementById('rt').value.trim()});alert("تم ✅");refresh('النتائج');}catch(e){alert(e.message)}};
window.getRes=async function(){try{let s=document.getElementById('seat').value.trim();let q=await getDocs(collection(db,"results"));let f=null;q.forEach(d=>{if(String(d.data().seat)===s)f=d.data()});document.getElementById('rr').innerHTML=f?esc(f.name)+" : "+esc(f.total):"غير موجود";}catch(e){alert(e.message)}};
window.upTable=async function(){try{let f=document.getElementById('tF').files[0];let ti=document.getElementById('tT').value.trim();if(!ti||!f)return alert("كمل البيانات");alert("جاري الرفع...");let url=await uploadToCloudinary(f);await addDoc(collection(db,"tables"),{title:ti,url,createdAt:Date.now()});alert("تم ✅");refresh('الجداول');}catch(e){alert(e.message)}};
window.addBookLink=async function(){try{let t=document.getElementById('bT').value.trim(),l=document.getElementById('bL').value.trim();if(!t||!l)return alert("كمل البيانات");if(!l.startsWith("https://"))return alert("الرابط لازم يبدأ ب https://");await addDoc(collection(db,"files"),{title:t,url:l,type:"link",createdAt:Date.now()});alert("تم ✅");refresh('الملفات');}catch(e){alert(e.message)}};
window.upTop=async function(){try{let f=document.getElementById('oF').files[0];let nm=document.getElementById('oN').value.trim();if(!nm||!f)return alert("كمل البيانات");alert("جاري الرفع...");let url=await uploadToCloudinary(f);await addDoc(collection(db,"tops"),{name:nm,total:document.getElementById('oT').value,url});alert("تم ✅");refresh('الأوائل');}catch(e){alert(e.message)}};
</script>
</body>
</html>
